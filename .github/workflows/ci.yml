name: CI

# Runs on every push to any branch and on every pull request targeting main.
on:
  push:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    env:
      # MAGIC_LINK_HMAC_KEY is required by convex/model/passwords at import
      # time when verifyOpaqueToken's HMAC path runs. Tests pin a deterministic
      # 64-hex key here (matches tests/setup.ts default) so opaque-token /
      # legacy discrimination is reproducible without leaking the prod key.
      MAGIC_LINK_HMAC_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      SESSION_SECRET: "test-session-secret-not-for-production-use"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

# NOTE — Playwright e2e (`test:e2e`) is intentionally NOT a CI job here in
# Sprint 1 either. The SCORM demo loop requires a live Convex dev deploy
# (NEXT_PUBLIC_CONVEX_URL pointing at dev:exuberant-corgi-88) plus a running
# Next.js server. Adding a separate `e2e.yml` workflow gated on a
# `CONVEX_DEPLOY_KEY` secret + a per-PR ephemeral preview is tracked for
# Sprint 2. For now `npm run test:e2e` is a local-only dev tool documented
# in tests/e2e/demo-loop.spec.ts.
#
# NOTE — Vercel preview deploys (AC-4) are triggered by the Vercel Git
# integration on push/PR, outside this workflow. Keeping `build` green is
# covered transitively: `next build` runs on Vercel for every preview.
