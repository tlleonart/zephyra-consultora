name: CI

# Runs on every push to any branch and on every pull request targeting main.
on:
  push:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm/action-setup MUST run before setup-node: setup-node's `cache: pnpm`
      # shells out to `pnpm store path`, which requires pnpm to already be on
      # PATH. Version is intentionally omitted so the action reads the
      # `packageManager` field in package.json (single source of truth).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `turbo run` fans the task out across every workspace that defines it and
      # skips the ones that do not, so the future www/backoffice/academia apps
      # and the packages/* are covered by this same job with no CI edit.
      - run: pnpm turbo run lint

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    env:
      # MAGIC_LINK_HMAC_KEY is required by convex/model/passwords at import
      # time when verifyOpaqueToken's HMAC path runs. Tests pin a deterministic
      # 64-hex key here (matches tests/setup.ts default) so opaque-token /
      # legacy discrimination is reproducible without leaking the prod key.
      MAGIC_LINK_HMAC_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      SESSION_SECRET: "test-session-secret-not-for-production-use"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # turbo 2 defaults to `strict` env mode: the vars above reach vitest only
      # because turbo.json declares them on the `test` task. Adding a new env
      # var here without declaring it there makes it arrive undefined.
      - run: pnpm turbo run test

  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    env:
      # NEXT_PUBLIC_CONVEX_URL is a NEXT_PUBLIC_* variable, so it is PUBLIC BY
      # DEFINITION: Next inlines it into the client bundles and ships it to every
      # browser. It is not a secret and needs no GitHub Secret.
      #
      # The value below is a deliberate PLACEHOLDER, not the dev deployment
      # (dev:exuberant-corgi-88). The build only needs the Convex client to be
      # CONSTRUCTIBLE, not reachable: apps/academia/src/app/api/lms/asset/[slug]/[...path]/route.ts
      # (moved there from apps/legacy at T-fe-008) calls
      # `new ConvexHttpClient(process.env.NEXT_PUBLIC_CONVEX_URL!)` at
      # MODULE scope, so `next build`'s page-data collection throws "Client
      # created with undefined deployment address" when the var is absent — that
      # is the single reason this repo had no build job until now. A
      # syntactically valid URL is enough.
      #
      # Nothing is fetched from Convex at build time: every page and route that
      # queries it is `export const dynamic = "force-dynamic"` and no
      # generateStaticParams touches the backend. So a live URL would add zero
      # build-time signal while coupling CI to a running deployment (and turning
      # a paused dev deploy into a red CI). The artifact assertion below is what
      # guards against a silently skipped build.
      NEXT_PUBLIC_CONVEX_URL: "https://ci-build-placeholder.convex.cloud"
      # NEXT_PUBLIC_APP_URL / NEXT_PUBLIC_ACADEMIA_URL — added after M4
      # (T-be-010) replaced the silent apex fallbacks with fail-fast throws.
      # Those throws fire at MODULE scope during page-data collection, so a
      # missing value now fails `next build` by design: the omission is meant to
      # surface in a deploy rather than in a learner's inbox. CI has no
      # .env.local (gitignored), so without these the build job goes red on
      # every commit — which is exactly what happened on 4347035.
      #
      # PLACEHOLDERS again, and public by definition. One caveat worth being
      # explicit about: a single job-level env cannot give academia and
      # backoffice DIFFERENT values, so this build does not exercise "each app
      # names its own origin". That is deliberately not the build's job —
      # apps/backoffice/tests/.../academiaLinks.test.ts asserts it in the `test`
      # job, and only a real deploy can catch a variable missing in Vercel.
      # The build job's contract is narrower: the code compiles and emits an
      # artifact.
      NEXT_PUBLIC_APP_URL: "https://ci-build-placeholder.zephyraconsultora.com"
      NEXT_PUBLIC_ACADEMIA_URL: "https://ci-build-placeholder-academia.zephyraconsultora.com"
      # NEXT_PUBLIC_WWW_URL — added when apps/academia's Navbar/Footer stopped
      # emitting RELATIVE hrefs to routes apps/www owns (/, /#servicios,
      # /#equipo, /proyectos, /blog, /contacto), all of which 404 on academia's
      # host. src/lib/institutional-links.ts resolves it through requireOrigin at
      # MODULE scope, so it throws during page-data collection exactly like the
      # two above, and omitting it here would red this job on every commit — the
      # same way 4347035 went red after T-be-010.
      #
      # PLACEHOLDER, and public by definition. The build only needs the origin to
      # be syntactically valid; nothing is fetched from it. Note the caveat that
      # already applies to the two variables above: one job-level env cannot give
      # each app a different value, so this build does not exercise "each app
      # names the right neighbour". apps/academia/tests/unit/app/cross-host-links.test.ts
      # asserts the link boundary in the `test` job instead, and only a real
      # deploy catches a variable missing from a Vercel project.
      NEXT_PUBLIC_WWW_URL: "https://ci-build-placeholder-www.zephyraconsultora.com"
      # NEXT_PUBLIC_BACKOFFICE_URL — added with the apex 301 map. apps/www's
      # next.config.ts builds the redirect list at BUILD time from
      # src/lib/cutover-redirects.ts, which throws when a destination origin is
      # missing rather than emitting an empty list (an empty list looks identical
      # to a working one until a real visitor hits /login).
      #
      # These three values must stay DISTINCT FROM EACH OTHER. The map carries a
      # loop guard that refuses to build when a destination equals
      # NEXT_PUBLIC_APP_URL — because the apex redirecting /cursos to itself loops
      # until the browser aborts. Collapsing these placeholders to one value would
      # trip that guard and red this job for a reason that has nothing to do with
      # the commit.
      NEXT_PUBLIC_BACKOFFICE_URL: "https://ci-build-placeholder-backoffice.zephyraconsultora.com"
      # NEXT_PUBLIC_APP_URL / NEXT_PUBLIC_SITE_URL are intentionally absent: the
      # build tolerates them being undefined and the artifact is discarded here.
      # A job that ever PUBLISHES an artifact would have to supply them.
      #
      # SESSION_SECRET / LEARNER_JWT_SECRET / MAGIC_LINK_HMAC_KEY are also
      # intentionally absent — no placeholders. All three resolve LAZILY (see the
      # comment block above getSecretKey in
      # apps/backoffice/src/features/auth/lib/session.ts and
      # apps/academia/src/features/auth-learner/lib/session.ts)
      # exactly so that `next build`, which runs with NODE_ENV=production but no
      # runtime env, does not crash at import time. Feeding placeholders in here
      # would mask a regression that moves any of them to a module-scope read —
      # and that read is the fail-closed guard production depends on.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `turbo run build` fans out to every workspace that defines a `build`
      # script. Since T-fe-009 retired apps/legacy that is the THREE real apps --
      # www, backoffice, academia (the packages/* are SOURCE-exported and emit
      # nothing). No CI edit was needed to pick each one up as it gained a
      # `build` script, which is exactly why the artifact assertion below
      # enumerates them explicitly: a workspace turbo SKIPS is indistinguishable
      # from one that succeeded.
      - run: pnpm turbo run build
      # A build job that silently skipped the build looks identical to a green
      # one, so assert the compile actually produced an artifact. `next build`
      # writes .next/BUILD_ID at the end of a successful run.
      - name: Assert a real build artifact was produced
        run: |
          # apps/legacy removed from this loop at T-fe-009 (the workspace no
          # longer exists, so asserting its BUILD_ID would red the job for a
          # non-code reason). The loop is otherwise UNCHANGED and must stay
          # exhaustive over the real apps: it is the only guard against a
          # silently-skipped build.
          for app in academia backoffice www; do
            test -f "apps/$app/.next/BUILD_ID" || {
              echo "::error::apps/$app/.next/BUILD_ID is missing — next build produced no artifact"
              exit 1
            }
            echo "$app BUILD_ID=$(cat "apps/$app/.next/BUILD_ID")"
          done
          # The SCORM asset proxy is load-bearing for the same-origin premise
          # (see route.ts); confirm it survived into the route manifest.
          #
          # RE-POINTED at T-fe-008: the proxy moved from apps/legacy to
          # apps/academia, which is the app that also serves the player page and
          # mints the session-learner cookie. Asserting it against apps/legacy
          # would now be asserting the WRONG app, and asserting it against both
          # would license the very duplication the same-origin premise forbids.
          # Not deleted and not weakened: this grep is what makes a silently
          # skipped or route-less build impossible to mistake for a green one.
          # Its in-source companion is
          # apps/academia/tests/unit/app/asset-proxy-same-origin.test.ts.
          grep -qF '"/api/lms/asset/[slug]/[...path]"' apps/academia/.next/routes-manifest.json || {
            echo "::error::the SCORM asset-proxy route is missing from apps/academia/.next/routes-manifest.json"
            exit 1
          }
          # And it must NOT reappear anywhere else: a second copy on another host
          # would serve assets cross-origin from the player and silently kill the
          # window.parent.API bridge.
          for app in backoffice www; do
            if grep -qF '"/api/lms/asset/[slug]/[...path]"' "apps/$app/.next/routes-manifest.json"; then
              echo "::error::the SCORM asset-proxy route also appears in apps/$app — it must exist ONLY in apps/academia (same-origin premise)"
              exit 1
            fi
          done

# NOTE — Playwright e2e (`test:e2e`) is intentionally NOT a CI job here in
# Sprint 1 either. Those specs require a live Convex dev deploy
# (NEXT_PUBLIC_CONVEX_URL pointing at dev:exuberant-corgi-88) plus a running
# Next.js server. Adding a separate `e2e.yml` workflow gated on a
# `CONVEX_DEPLOY_KEY` secret + a per-PR ephemeral preview is tracked for
# Sprint 2. For now `pnpm --filter @zephyra/academia test:e2e` is a local-only
# dev tool; it runs the two single-host specs (org-packs, org-seats).
#
# RE-POINTED at T-fe-009: apps/legacy is gone, and the SCORM demo loop it used
# to host is no longer runnable by ANY workspace — after the split it spans two
# hosts (/login + /admin on backoffice, /cursos + player on academia) against a
# single Playwright baseURL. It is quarantined at tests/cross-host/demo-loop.spec.ts,
# deliberately outside every workspace and every test glob, and is named in
# T-e2e-019 (M6 cross-host e2e). Do not add it to an app's testDir to "restore"
# it — a single-baseURL harness cannot express it.
#
# NOTE — Vercel preview deploys (AC-4) are triggered by the Vercel Git
# integration on push/PR, outside this workflow. That preview is EXPECTED TO
# FAIL on the monorepo-scaffold branch and until the split lands: the existing
# Vercel project's Root Directory still points at the repo root, where there is
# no longer a Next.js app. Per-app Vercel projects (one Root Directory each) are
# wired in M6.2; production is unaffected because it deploys from `main` only.
# `build` is NO LONGER covered only transitively: the dedicated `build` job above
# compiles the monorepo on CI's Node 20, so GitHub Actions — not the Vercel
# preview — is the authoritative build gate.
