name: CI

# Runs on every push to any branch and on every pull request targeting main.
on:
  push:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm/action-setup MUST run before setup-node: setup-node's `cache: pnpm`
      # shells out to `pnpm store path`, which requires pnpm to already be on
      # PATH. Version is intentionally omitted so the action reads the
      # `packageManager` field in package.json (single source of truth).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `turbo run` fans the task out across every workspace that defines it and
      # skips the ones that do not, so the future www/backoffice/academia apps
      # and the packages/* are covered by this same job with no CI edit.
      - run: pnpm turbo run lint

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    env:
      # MAGIC_LINK_HMAC_KEY is required by convex/model/passwords at import
      # time when verifyOpaqueToken's HMAC path runs. Tests pin a deterministic
      # 64-hex key here (matches tests/setup.ts default) so opaque-token /
      # legacy discrimination is reproducible without leaking the prod key.
      MAGIC_LINK_HMAC_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      SESSION_SECRET: "test-session-secret-not-for-production-use"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # turbo 2 defaults to `strict` env mode: the vars above reach vitest only
      # because turbo.json declares them on the `test` task. Adding a new env
      # var here without declaring it there makes it arrive undefined.
      - run: pnpm turbo run test

  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    env:
      # NEXT_PUBLIC_CONVEX_URL is a NEXT_PUBLIC_* variable, so it is PUBLIC BY
      # DEFINITION: Next inlines it into the client bundles and ships it to every
      # browser. It is not a secret and needs no GitHub Secret.
      #
      # The value below is a deliberate PLACEHOLDER, not the dev deployment
      # (dev:exuberant-corgi-88). The build only needs the Convex client to be
      # CONSTRUCTIBLE, not reachable: src/app/api/lms/asset/[slug]/[...path]/route.ts
      # calls `new ConvexHttpClient(process.env.NEXT_PUBLIC_CONVEX_URL!)` at
      # MODULE scope, so `next build`'s page-data collection throws "Client
      # created with undefined deployment address" when the var is absent — that
      # is the single reason this repo had no build job until now. A
      # syntactically valid URL is enough.
      #
      # Nothing is fetched from Convex at build time: every page and route that
      # queries it is `export const dynamic = "force-dynamic"` and no
      # generateStaticParams touches the backend. So a live URL would add zero
      # build-time signal while coupling CI to a running deployment (and turning
      # a paused dev deploy into a red CI). The artifact assertion below is what
      # guards against a silently skipped build.
      NEXT_PUBLIC_CONVEX_URL: "https://ci-build-placeholder.convex.cloud"
      # NEXT_PUBLIC_APP_URL / NEXT_PUBLIC_SITE_URL are intentionally absent: the
      # build tolerates them being undefined and the artifact is discarded here.
      # A job that ever PUBLISHES an artifact would have to supply them.
      #
      # SESSION_SECRET / LEARNER_JWT_SECRET / MAGIC_LINK_HMAC_KEY are also
      # intentionally absent — no placeholders. All three resolve LAZILY (see the
      # comment block above getSecretKey in src/features/auth/lib/session.ts)
      # exactly so that `next build`, which runs with NODE_ENV=production but no
      # runtime env, does not crash at import time. Feeding placeholders in here
      # would mask a regression that moves any of them to a module-scope read —
      # and that read is the fail-closed guard production depends on.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `turbo run build` fans out to every workspace that defines a `build`
      # script. Today that is only apps/legacy (the packages/* are
      # SOURCE-exported and emit nothing), so this is one task; the future
      # www/backoffice/academia apps are picked up with no CI edit.
      - run: pnpm turbo run build
      # A build job that silently skipped the build looks identical to a green
      # one, so assert the compile actually produced an artifact. `next build`
      # writes .next/BUILD_ID at the end of a successful run.
      - name: Assert a real build artifact was produced
        run: |
          test -f apps/legacy/.next/BUILD_ID || {
            echo "::error::apps/legacy/.next/BUILD_ID is missing — next build produced no artifact"
            exit 1
          }
          echo "BUILD_ID=$(cat apps/legacy/.next/BUILD_ID)"
          # The SCORM asset proxy is load-bearing for the same-origin premise
          # (see route.ts); confirm it survived into the route manifest.
          grep -qF '"/api/lms/asset/[slug]/[...path]"' apps/legacy/.next/routes-manifest.json || {
            echo "::error::the SCORM asset-proxy route is missing from routes-manifest.json"
            exit 1
          }

# NOTE — Playwright e2e (`test:e2e`) is intentionally NOT a CI job here in
# Sprint 1 either. The SCORM demo loop requires a live Convex dev deploy
# (NEXT_PUBLIC_CONVEX_URL pointing at dev:exuberant-corgi-88) plus a running
# Next.js server. Adding a separate `e2e.yml` workflow gated on a
# `CONVEX_DEPLOY_KEY` secret + a per-PR ephemeral preview is tracked for
# Sprint 2. For now `pnpm --filter @zephyra/legacy test:e2e` is a local-only
# dev tool documented in apps/legacy/tests/e2e/demo-loop.spec.ts.
#
# NOTE — Vercel preview deploys (AC-4) are triggered by the Vercel Git
# integration on push/PR, outside this workflow. That preview is EXPECTED TO
# FAIL on the monorepo-scaffold branch and until the split lands: the existing
# Vercel project's Root Directory still points at the repo root, where there is
# no longer a Next.js app. Per-app Vercel projects (one Root Directory each) are
# wired in M6.2; production is unaffected because it deploys from `main` only.
# `build` is NO LONGER covered only transitively: the dedicated `build` job above
# compiles the monorepo on CI's Node 20, so GitHub Actions — not the Vercel
# preview — is the authoritative build gate.
